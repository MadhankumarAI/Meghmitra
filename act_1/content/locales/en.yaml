templates:
  DELAY_SOWING:
    verdict: Wait to sow
    verdict_sub: '{crop}: sow after {wait_until}'
    headline: Do not sow {crop} before {wait_until}.
    actions:
    - Do not sow now, even if it rains this week. The seed may dry out and die.
    - Keep your seed and fertiliser ready.
    - When the soil is moist 15 cm deep, sow after {wait_until}.
  SOW_NOW:
    verdict: Sow now
    verdict_sub: '{crop}: sow before {sow_by}'
    headline: This is a good time to sow {crop}. Sow before {sow_by}.
    actions:
    - The soil has enough moisture and steady rain is expected.
    - Use treated seed of a recommended variety.
    - Apply basal fertiliser at sowing.
  PREPARE_IRRIGATION:
    verdict: Get irrigation ready
    verdict_sub: '{crop}'
    headline: A dry period may affect your {crop}. Get ready to irrigate.
    actions:
    - Check your pump, pipes and water source now.
    - If there is no rain for a week, irrigate the crop once.
    - Irrigate in the evening or early morning to save water.
  SWITCH_CROP:
    verdict: Switch to {alternative}
    verdict_sub: instead of {crop}
    headline: It is too risky to sow {crop} now. Sow {alternative} instead, before {sow_by}.
    actions:
    - Do not sow {crop} this season on land without irrigation.
    - Sow {alternative} before {sow_by}. It needs less water and less time.
    - Ask your agriculture office or KVK for {alternative} seed.
  HEAVY_RAIN_PROTECT:
    verdict: Heavy rain coming
    verdict_sub: Protect {crop}
    headline: Heavy rain is expected. Protect your {crop} and stored produce.
    actions:
    - Clear the field drains so that water does not stand in the field.
    - Do not spray pesticide or apply fertiliser before the rain.
    - Move harvested produce and seed to a dry, high place.
  DRY_SPELL_CONSERVE_MOISTURE:
    verdict: Save soil moisture
    verdict_sub: '{crop}'
    headline: A dry period is expected. Save the moisture in your {crop} field.
    actions:
    - Remove weeds, because they take water from the crop.
    - Loosen the top soil lightly between the rows, or cover the soil with crop residue.
    - Wait for rain before you apply top-dressing fertiliser.
  ALL_CLEAR:
    verdict: No action needed
    verdict_sub: '{crop}: conditions normal'
    headline: No weather risk is expected for {crop} in the coming weeks.
    actions:
    - Continue your normal farm work.
    - We will message you if the forecast changes.
