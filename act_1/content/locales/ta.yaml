entries:
  strings.service:
    source: Mungaru monsoon advisories
    text: முங்காரு ஆலோசனை
    status: machine
  strings.welcome_word:
    source: Welcome
    text: வரவேற்கிறேன்
    status: machine
  strings.tagline:
    source: Monsoon advice for your farm
    text: உங்கள் பண்ணைக்கு பருவமழைக்கால ஆலோசனை
    status: machine
  strings.your_block:
    source: Your block
    text: உங்கள் தொகுதி
    status: machine
  strings.subscribed_title:
    source: You are subscribed
    text: நீங்கள் சந்தா பெற்றுள்ளீர்கள்
    status: machine
  strings.outlook_usual:
    source: usually {usual}
    text: பொதுவாக {usual}
    status: machine
  strings.lang_word:
    source: Language
    text: மொழி
    status: machine
  strings.lang_list_button:
    source: Languages
    text: மொழிகள்
    status: machine
  strings.welcome:
    source: Welcome to Mungaru. We send free weather advice for your crops, approved by your agriculture officer.
    text: முங்காருவிற்கு வரவேற்கிறோம். உங்கள் விவசாய அதிகாரியின் ஒப்புதலுடன் உங்கள் பயிர்களுக்கு இலவச வானிலை ஆலோசனையை அனுப்புகிறோம்.
    status: machine
  strings.location_prompt:
    source: Share your farm location so we can find your block. Tap the button below, or type your 6-digit PIN code.
    text: உங்கள் பண்ணை இருப்பிடத்தைப் பகிர்ந்து கொள்ளுங்கள், இதனால் உங்கள் தொகுதியைக் காணலாம். கீழே உள்ள பொத்தானைத் தட்டவும் அல்லது உங்கள் 6 இலக்க பின் குறியீட்டைத் தட்டச்சு செய்யவும்.
    status: machine
  strings.block_found:
    source: Your block is {block}, {district} district. Is this correct?
    text: உங்கள் தொகுதி {block}, {district} மாவட்டம். இது சரியா?
    status: machine
  strings.btn_yes:
    source: Yes, correct
    text: ஆம், சரிதான்
    status: machine
  strings.btn_no:
    source: No, change it
    text: இல்லை, அதை மாற்றவும்
    status: machine
  strings.block_not_found:
    source: We could not find a block for this location. Please share your location again, or type your 6-digit PIN code.
    text: இந்த இடத்திற்கான ஒரு தொகுதியை எங்களால் கண்டுபிடிக்க முடியவில்லை. தயவுசெய்து உங்கள் இருப்பிடத்தை மீண்டும் பகிர்ந்து கொள்ளுங்கள், அல்லது உங்கள் 6 இலக்க பின் குறியீட்டை உள்ளிடவும்.
    status: machine
  strings.pin_not_found:
    source: We could not find the PIN code {pin}. Please check it, or share your location.
    text: பின் குறியீடு {pin} எங்களால் கண்டுபிடிக்க முடியவில்லை. தயவுசெய்து அதை சரிபார்க்கவும் அல்லது உங்கள் இருப்பிடத்தைப் பகிர்ந்து கொள்ளுங்கள்.
    status: machine
  strings.pick_block:
    source: Choose your block from the list.
    text: பட்டியலில் இருந்து உங்கள் தொகுதியைத் தேர்ந்தெடுக்கவும்.
    status: machine
  strings.pick_block_button:
    source: Blocks
    text: தொகுதிகள்
    status: machine
  strings.share_again:
    source: Share location again
    text: இருப்பிடத்தை அனுப்பவும்
    status: machine
  strings.crop_prompt:
    source: Which crop do you grow? Choose one. You can add more after this.
    text: நீங்கள் எந்தப் பயிரை பயிரிடுகிறீர்கள்? ஒன்றைத் தேர்ந்தெடுங்கள். இதற்குப் பிறகு நீங்கள் மேலும் பயிரிடலாம்.
    status: machine
  strings.crop_list_button:
    source: Crops
    text: பயிர்கள்
    status: machine
  strings.crop_added:
    source: 'Selected: {crops}. Add another crop, or tap Done.'
    text: தேர்ந்தெடுக்கப்பட்டதுஃ {crops}. மற்றொரு பயிரைச் சேர்க்கவும், அல்லது முடிந்தது என்பதைத் தட்டவும்.
    status: machine
  strings.btn_add_crop:
    source: Add another crop
    text: இன்னொரு பயிர்
    status: glossary
  strings.other_crop:
    source: Other crop
    text: பிற பயிர்கள்
    status: machine
  strings.crop_type_prompt:
    source: Type the name of your crop.
    text: உங்கள் பயிரின் பெயரை உள்ளிடவும்.
    status: machine
  strings.crop_done:
    source: Done
    text: முடிந்தது
    status: machine
  strings.crop_need_one:
    source: Please choose at least one crop.
    text: குறைந்தபட்சம் ஒரு பயிரையாவது தேர்வு செய்யுங்கள்.
    status: machine
  strings.subscribed:
    source: You are subscribed. We will send advice for {crops} in {block} when there is something you need to know. Send STOP at any time to stop.
    text: நீங்கள் சந்தா பெற்றுள்ளீர்கள். நீங்கள் தெரிந்து கொள்ள வேண்டிய ஏதாவது இருக்கும்போது {crops} க்கு {block} இல் ஆலோசனை அனுப்புவோம். நிறுத்த எந்த நேரத்திலும் STOP ஐ அனுப்பவும்.
    status: machine
  strings.crops_updated:
    source: 'Your crops are now: {crops}.'
    text: உங்கள் பயிர்கள் இப்போதுஃ {crops}.
    status: machine
  strings.menu_prompt:
    source: What would you like to do?
    text: நீங்கள் என்ன செய்ய விரும்புகிறீர்கள்?
    status: machine
  strings.menu_footer:
    source: Send STOP to unsubscribe
    text: குழுவிலகலாக STOP ஐ அனுப்பவும்
    status: machine
  strings.btn_outlook:
    source: 4-week outlook
    text: அடுத்த 4 வாரங்கள்
    status: machine
  strings.btn_change_crop:
    source: Change crop
    text: பயிர் மாற்றுங்கள்
    status: machine
  strings.btn_officer:
    source: Talk to officer
    text: அழைப்பு அதிகாரி
    status: machine
  strings.btn_menu:
    source: Main menu
    text: பிரதான மெனு
    status: machine
  strings.officer_intro:
    source: Here is your agriculture officer. Tap the contact to call.
    text: இதோ உங்கள் விவசாய அதிகாரி. தொடர்பு கொள்ள தொடர்பு கொள்ளுங்கள்.
    status: machine
  strings.officer_kcc:
    source: 'Kisan Call Centre, free call: {kcc}'
    text: கிசான் அழைப்பு மையம், இலவச அழைப்புஃ {kcc}
    status: machine
  strings.officer_notified:
    source: We have also asked the officer to call you.
    text: உங்களை அழைக்கவும் அதிகாரியிடம் கேட்டோம்.
    status: machine
  strings.officer_alert:
    source: 'A farmer in {block} asked to talk. Phone: {phone}. Crops: {crops}.'
    text: ஒரு விவசாயி {block} இல் பேசச் சொன்னார். தொலைபேசிஃ {phone}. பயிர்கள்ஃ {crops}.
    status: machine
  strings.no_officer:
    source: No officer is listed for your block yet. Please call the Kisan Call Centre.
    text: உங்கள் தொகுதிக்கு இதுவரை எந்த அதிகாரியும் பட்டியலிடப்படவில்லை. தயவுசெய்து கிசான் அழைப்பு மையத்தை அழைக்கவும்.
    status: machine
  strings.stop_confirm:
    source: You are unsubscribed. You will not get any more messages. Send START to subscribe again.
    text: நீங்கள் சந்தா விலக்கப்பட்டுள்ளீர்கள். இனி எந்த செய்தியும் உங்களுக்கு கிடைக்காது. மீண்டும் சந்தா செலுத்த START ஐ அனுப்பவும்.
    status: machine
  strings.start_confirm:
    source: Welcome back. You are subscribed again.
    text: மீண்டும் வரவேற்கிறேன். நீங்கள் மீண்டும் சந்தா செலுத்தினீர்கள்.
    status: machine
  strings.opted_out_hint:
    source: You are unsubscribed. Send START to subscribe again.
    text: நீங்கள் சந்தா விலக்கப்பட்டுள்ளீர்கள். மீண்டும் சந்தா செலுத்த START ஐ அனுப்பவும்.
    status: machine
  strings.tap_hint:
    source: Please tap one of the buttons below.
    text: தயவுசெய்து கீழே உள்ள பொத்தான்களில் ஒன்றைத் தட்டவும்.
    status: machine
