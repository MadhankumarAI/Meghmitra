  strings.lang_word:
    source: Language
    text: భాష
    status: machine
  strings.lang_list_button:
    source: Languages
    text: భాషలు
    status: machine
  strings.welcome:
    source: Welcome to Meghmitra. We send free weather advice for your crops, approved by your agriculture officer.
    text: మేఘమిత్రకు స్వాగతం. మీ వ్యవసాయ అధికారి ఆమోదించిన మీ పంటలకు మేము ఉచిత వాతావరణ సలహాలను పంపుతాము.
    status: machine
  strings.location_prompt:
    source: Share your farm location so we can find your block. Tap the button below, or type your 6-digit PIN code.
    text: మీ పొలం ఉన్న ప్రదేశాన్ని పంచుకోండి, తద్వారా మేము మీ బ్లాక్ను కనుగొనవచ్చు. దిగువ బటన్ను నొక్కండి లేదా మీ 6 అంకెల పిన్ కోడ్ను టైప్ చేయండి.
    status: machine
  strings.block_found:
    source: Your block is {block}, {district} district. Is this correct?
    text: మీ బ్లాక్ {block}, {district} జిల్లా. ఇది సరైనదేనా?
    status: machine
  strings.btn_yes:
    source: Yes, correct
    text: అవును, సరైనది
    status: machine
  strings.btn_no:
    source: No, change it
    text: కాదు, మార్చండి
    status: glossary
  strings.block_not_found:
    source: We could not find a block for this location. Please share your location again, or type your 6-digit PIN code.
    text: ఈ స్థానానికి ఒక బ్లాక్ మాకు దొరకలేదు. దయచేసి మీ స్థానాన్ని మళ్ళీ పంచుకోండి లేదా మీ 6 అంకెల పిన్ కోడ్ను టైప్ చేయండి.
    status: machine
  strings.pin_not_found:
    source: We could not find the PIN code {pin}. Please check it, or share your location.
    text: మాకు పిన్ కోడ్ {pin} దొరకలేదు. దయచేసి దాన్ని తనిఖీ చేయండి లేదా మీ స్థానాన్ని పంచుకోండి.
    status: machine
  strings.pick_block:
    source: Choose your block from the list.
    text: జాబితా నుండి మీ బ్లాక్ను ఎంచుకోండి.
    status: machine
  strings.pick_block_button:
    source: Blocks
    text: బ్లాక్స్
    status: machine
  strings.share_again:
    source: Share location again
    text: స్థానాన్ని పంపండి
    status: machine
  strings.crop_prompt:
    source: Which crop do you grow? Choose one. You can add more after this.
    text: మీరు ఏ పంటను పండిస్తారు? ఒకదాన్ని ఎంచుకోండి. దీని తరువాత మీరు మరిన్ని పంటలను జోడించవచ్చు.
    status: machine
  strings.crop_list_button:
    source: Crops
    text: పంటలు
    status: machine
  strings.crop_added:
    source: 'Selected: {crops}. Add another crop, or tap Done.'
    text: ఎంచుకున్నదిః {crops}. మరొక పంటను జోడించండి, లేదా పూర్తయింది నొక్కండి.
    status: machine
  strings.btn_add_crop:
    source: Add another crop
    text: మరో పంటను జోడించండి
    status: machine
  strings.other_crop:
    source: Other crop
    text: ఇతర పంటలు
    status: machine
  strings.crop_type_prompt:
    source: Type the name of your crop.
    text: మీ పంట పేరును టైప్ చేయండి.
    status: machine
  strings.crop_done:
    source: Done
    text: పూర్తయింది
    status: machine
  strings.crop_need_one:
    source: Please choose at least one crop.
    text: దయచేసి కనీసం ఒక పంటను ఎంచుకోండి.
    status: machine
  strings.subscribed:
    source: You are subscribed. We will send advice for {crops} in {block} when there is something you need to know. Send STOP at any time to stop.
    text: మీరు సభ్యత్వాన్ని పొందారు. మీరు తెలుసుకోవలసిన ఏదైనా ఉన్నప్పుడు మేము {crops} కోసం {block} లో సలహాను పంపుతాము. ఆపడానికి ఎప్పుడైనా STOP పంపండి.
    status: machine
  strings.crops_updated:
    source: 'Your crops are now: {crops}.'
    text: మీ పంటలు ఇప్పుడుః {crops}.
    status: machine
  strings.menu_prompt:
    source: What would you like to do?
    text: మీరు ఏమి చేయాలనుకుంటున్నారు?
    status: machine
  strings.menu_footer:
    source: Send STOP to unsubscribe
    text: చందాను తొలగించడానికి STOP పంపండి
    status: machine
  strings.btn_outlook:
    source: 4-week outlook
    text: తదుపరి 4 వారాలు
    status: machine
  strings.btn_change_crop:
    source: Change crop
    text: పంటను మార్చండి
    status: machine
  strings.btn_officer:
    source: Talk to officer
    text: కాల్ ఆఫీసర్
    status: machine
  strings.btn_menu:
    source: Main menu
    text: ప్రధాన మెనూ
    status: machine
  strings.officer_intro:
    source: Here is your agriculture officer. Tap the contact to call.
    text: మీ వ్యవసాయ అధికారి ఇక్కడ ఉన్నారు. కాల్ చేయడానికి సంప్రదింపును నొక్కండి.
    status: machine
  strings.officer_kcc:
    source: 'Kisan Call Centre, free call: {kcc}'
    text: కిసాన్ కాల్ సెంటర్, ఉచిత కాల్ః {kcc}
    status: machine
  strings.officer_notified:
    source: We have also asked the officer to call you.
    text: మీకు ఫోన్ చేయమని కూడా మేము ఆ అధికారిని అడిగాము.
    status: machine
  strings.officer_alert:
    source: 'A farmer in {block} asked to talk. Phone: {phone}. Crops: {crops}.'
    text: '{block} లో ఉన్న ఒక రైతు మాట్లాడమని అడిగాడు. ఫోన్ః {phone}. పంటలుః {crops}.'
    status: machine
  strings.no_officer:
    source: No officer is listed for your block yet. Please call the Kisan Call Centre.
    text: మీ బ్లాక్ కోసం ఇంకా ఏ అధికారి జాబితా చేయబడలేదు. దయచేసి కిసాన్ కాల్ సెంటర్కు కాల్ చేయండి.
    status: machine
  strings.stop_confirm:
    source: You are unsubscribed. You will not get any more messages. Send START to subscribe again.
    text: మీరు చందాను తొలగించారు. మీకు ఇక సందేశాలు రావు. మళ్ళీ చందాను పొందడానికి START పంపండి.
    status: machine
  strings.start_confirm:
    source: Welcome back. You are subscribed again.
    text: తిరిగి స్వాగతం. మీరు మళ్ళీ సభ్యత్వాన్ని పొందారు.
    status: machine
  strings.opted_out_hint:
    source: You are unsubscribed. Send START to subscribe again.
    text: మీరు చందాను తొలగించారు. మళ్ళీ చందాను పొందడానికి START పంపండి.
    status: machine
  strings.tap_hint:
    source: Please tap one of the buttons below.
    text: దయచేసి దిగువ బటన్లలో ఒకదాన్ని నొక్కండి.
    status: machine
  strings.language_changed:
    source: Language changed.
    text: భాష మారింది.
    status: machine
  strings.outlook_title:
    source: Weather forecast for {block}, next 4 weeks
    text: '{block}, వచ్చే 4 వారాల వాతావరణ సూచన'
    status: machine
  strings.outlook_unavailable:
    source: The forecast for {block} is not available right now. Please try again later.
    text: '{block} కోసం సూచన ప్రస్తుతం అందుబాటులో లేదు. దయచేసి తరువాత మళ్లీ ప్రయత్నించండి.'
    status: machine
  strings.outlook_line:
    source: '{event}: {chance} (usually {usual})'
    text: '{event}: {chance} (సాధారణంగా {usual})'
