  strings.outlook_footer:
    source: The forecast for week 4 is less certain than for week 1.
    text: 4వ వారానికి సంబంధించిన అంచనా 1వ వారంతో పోలిస్తే తక్కువ ఖచ్చితమైనది.
    status: machine
  strings.outlook_normal:
    source: Close to normal
    text: సాధారణ స్థితికి దగ్గరగా
    status: machine
  strings.week_label:
    source: Week {n}
    text: వారం {n}
    status: machine
  strings.chance:
    source: '{n} in 10'
    text: 10 లో {n}
    status: machine
  strings.chance_lt1:
    source: less than 1 in 10
    text: 10 లో 1 కంటే తక్కువ
    status: machine
  strings.reason:
    source: Between {start} and {end}, the chance of {event} is {chance}. The usual chance is {usual}.
    text: '{start} మరియు {end} మధ్య, {event} అవకాశం {chance}. సాధారణ అవకాశం {usual}.'
