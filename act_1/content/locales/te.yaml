entries:
  strings.service:
    source: Meghmitra monsoon advisories
    text: మేఘమిత్రకు సలహా
    status: machine
  strings.welcome_word:
    source: Welcome
    text: స్వాగతం
    status: machine
  strings.tagline:
    source: Monsoon advice for your farm
    text: మీ పొలానికి రుతుపవనాల సలహా
    status: machine
  strings.your_block:
    source: Your block
    text: మీ బ్లాక్
    status: machine
  strings.subscribed_title:
    source: You are subscribed
    text: మీరు చందాదారులు
    status: machine
  strings.outlook_usual:
    source: usually {usual}
