  strings.next_weeks:
    source: Next 4 weeks
    text: తదుపరి 4 వారాలు
    status: machine
  strings.what_to_do:
    source: What to do
    text: ఏం చేయాలి?
    status: machine
  strings.confidence_high:
    source: High certainty
    text: అధిక ఖచ్చితత్వం
    status: machine
  strings.confidence_medium:
    source: Medium certainty
    text: మధ్యస్థ ఖచ్చితత్వం
    status: machine
  strings.confidence_low:
    source: Low certainty
    text: తక్కువ ఖచ్చితత్వం
    status: machine
  strings.cmri_normal:
    source: Normal
    text: గ్రీన్ అలర్ట్
    status: machine
  strings.cmri_watch:
    source: Watch
    text: పసుపు హెచ్చరిక
    status: machine
  strings.cmri_warning:
    source: Warning
    text: ఆరెంజ్ అలర్ట్
    status: machine
  strings.cmri_alert:
    source: Alert
    text: రెడ్ అలర్ట్
    status: machine
  strings.imd_normal:
    source: No action needed
    text: చర్య అవసరం లేదు
    status: machine
  strings.imd_watch:
    source: Be aware
    text: అవగాహన కలిగి ఉండండి
    status: machine
  strings.imd_warning:
    source: Be prepared
    text: సిద్ధంగా ఉండండి
    status: machine
  strings.imd_alert:
    source: Take action
    text: చర్యలు తీసుకోండి
    status: machine
  strings.ev_onset:
    source: Rain starts
    text: రుతుపవనాల వర్షం ప్రారంభం
    status: machine
  strings.ev_dry_spell:
    source: Dry period
    text: పొడి కాలం
    status: machine
  strings.ev_heavy_rain:
    source: Heavy rain
    text: భారీ వర్షాలు
    status: machine
  strings.event_onset:
    source: the start of steady monsoon rain
    text: స్థిరమైన రుతుపవనాల వర్షం ప్రారంభం
    status: machine
  strings.event_false_onset:
    source: early rain followed by a long dry period
    text: ముందస్తు వర్షం తరువాత సుదీర్ఘ పొడి కాలం
    status: machine
  strings.event_dry_spell_7d:
    source: a dry period of 7 days or more without rain
    text: వర్షం లేకుండా 7 రోజులు లేదా అంతకంటే ఎక్కువ పొడి కాలం
    status: machine
  strings.event_dry_spell_10d:
    source: a dry period of 10 days or more without rain
    text: వర్షం లేకుండా 10 రోజులు లేదా అంతకంటే ఎక్కువ పొడి కాలం
    status: machine
  strings.event_heavy_rain:
    source: heavy rain of more than 6 cm in a day
    text: ఒక రోజులో 6 సెంటీమీటర్ల కంటే ఎక్కువ భారీ వర్షం
    status: machine
  templates.DELAY_SOWING.verdict:
    source: Wait to sow
    text: విత్తడానికి వేచి ఉండండి
    status: machine
  templates.DELAY_SOWING.verdict_sub:
    source: '{crop}: sow after {wait_until}'
    text: '{crop}: {wait_until} తర్వాత విత్తండి'
    status: machine
  templates.DELAY_SOWING.headline:
    source: Do not sow {crop} before {wait_until}.
    text: '{wait_until} కి ముందు {crop} ను నాటవద్దు.'
    status: machine
  templates.DELAY_SOWING.actions.0:
    source: Do not sow now, even if it rains this week. The seed may dry out and die.
    text: ఈ వారం వర్షం పడినప్పటికీ ఇప్పుడు విత్తకండి. విత్తనాలు ఎండిపోయి చనిపోవచ్చు.
    status: machine
  templates.DELAY_SOWING.actions.1:
    source: Keep your seed and fertiliser ready.
    text: మీ విత్తనాలు మరియు ఎరువులను సిద్ధంగా ఉంచుకోండి.
    status: machine
  templates.DELAY_SOWING.actions.2:
    source: When the soil is moist 15 cm deep, sow after {wait_until}.
    text: మట్టి 15 సెంటీమీటర్ల లోతు తేమగా ఉన్నప్పుడు, {wait_until} తర్వాత విత్తండి.
    status: machine
  templates.SOW_NOW.verdict:
    source: Sow now
    text: ఇప్పుడు విత్తండి
    status: machine
  templates.SOW_NOW.verdict_sub:
    source: '{crop}: sow before {sow_by}'
    text: '{crop}: {sow_by} కి ముందు విత్తండి'
    status: machine
  templates.SOW_NOW.headline:
    source: This is a good time to sow {crop}. Sow before {sow_by}.
    text: '{crop} విత్తడానికి ఇది మంచి సమయం. {sow_by} కి ముందు విత్తండి.'
    status: machine
  templates.SOW_NOW.actions.0:
    source: The soil has enough moisture and steady rain is expected.
    text: మట్టిలో తగినంత తేమ ఉంటుంది మరియు స్థిరమైన వర్షం కురిసే అవకాశం ఉంది.
    status: machine
  templates.SOW_NOW.actions.1:
    source: Use treated seed of a recommended variety.
    text: సిఫార్సు చేయబడిన రకానికి చెందిన చికిత్స చేయబడిన విత్తనాలను ఉపయోగించండి.
    status: machine
  templates.SOW_NOW.actions.2:
    source: Apply basal fertiliser at sowing.
    text: విత్తనాలు నాటుతున్నప్పుడు బేసల్ ఎరువులను అప్లై చేయండి.
    status: machine
  templates.PREPARE_IRRIGATION.verdict:
    source: Get irrigation ready
    text: నీటిపారుదల సిద్ధంగా ఉండండి
    status: machine
  templates.PREPARE_IRRIGATION.verdict_sub:
    source: '{crop}'
    text: '{crop}'
    status: machine
  templates.PREPARE_IRRIGATION.headline:
    source: A dry period may affect your {crop}. Get ready to irrigate.
    text: పొడి కాలం మీ {crop} ను ప్రభావితం చేయవచ్చు. నీటిపారుదలకి సిద్ధంగా ఉండండి.
    status: machine
  templates.PREPARE_IRRIGATION.actions.0:
    source: Check your pump, pipes and water source now.
    text: మీ పంపు, పైపులు మరియు నీటి వనరులను ఇప్పుడు తనిఖీ చేయండి.
    status: machine
  templates.PREPARE_IRRIGATION.actions.1:
    source: If there is no rain for a week, irrigate the crop once.
    text: ఒక వారం పాటు వర్షం పడకపోతే, పంటకు ఒకసారి నీటిపారుదల చేయండి.
    status: machine
  templates.PREPARE_IRRIGATION.actions.2:
    source: Irrigate in the evening or early morning to save water.
    text: నీటిని ఆదా చేయడానికి సాయంత్రం లేదా ఉదయాన్నే నీటిపారుదల చేయండి.
    status: machine
  templates.SWITCH_CROP.verdict:
    source: Switch to {alternative}
    text: '{alternative} కు మారండి'
    status: machine
  templates.SWITCH_CROP.verdict_sub:
    source: instead of {crop}
    text: బదులుగా {crop}
    status: machine
  templates.SWITCH_CROP.headline:
    source: It is too risky to sow {crop} now. Sow {alternative} instead, before {sow_by}.
    text: ఇప్పుడు {crop} విత్తడం చాలా ప్రమాదకరం. బదులుగా {sow_by} ముందు {alternative} విత్తండి.
    status: machine
  templates.SWITCH_CROP.actions.0:
    source: Do not sow {crop} this season on land without irrigation.
    text: ఈ సీజన్లో నీటిపారుదల లేకుండా భూమిపై {crop} విత్తకండి.
    status: machine
  templates.SWITCH_CROP.actions.1:
    source: Sow {alternative} before {sow_by}. It needs less water and less time.
    text: '{sow_by} కి ముందు {alternative} విత్తండి. దీనికి తక్కువ నీరు మరియు తక్కువ సమయం అవసరం.'
    status: machine
  templates.SWITCH_CROP.actions.2:
    source: Ask your agriculture office or KVK for {alternative} seed.
    text: మీ వ్యవసాయ కార్యాలయాన్ని లేదా {alternative} విత్తనం కోసం KVK అడగండి.
    status: machine
  templates.HEAVY_RAIN_PROTECT.verdict:
    source: Heavy rain coming
    text: భారీ వర్షాలు కురుస్తున్నాయి
    status: machine
  templates.HEAVY_RAIN_PROTECT.verdict_sub:
    source: Protect {crop}
    text: '{crop} ను రక్షించండి'
    status: machine
  templates.HEAVY_RAIN_PROTECT.headline:
    source: Heavy rain is expected. Protect your {crop} and stored produce.
    text: భారీ వర్షాలు కురిసే అవకాశం ఉంది. మీ {crop} మరియు నిల్వ చేసిన ఉత్పత్తులను రక్షించుకోండి.
    status: machine
  templates.HEAVY_RAIN_PROTECT.actions.0:
    source: Clear the field drains so that water does not stand in the field.
    text: పొలంలో నీరు నిలవకుండా పొలంలోని కాలువలను శుభ్రం చేయండి.
    status: machine
  templates.HEAVY_RAIN_PROTECT.actions.1:
    source: Do not spray pesticide or apply fertiliser before the rain.
    text: వర్షానికి ముందు పురుగుమందులను చల్లవద్దు లేదా ఎరువులను పూయవద్దు.
    status: machine
  templates.HEAVY_RAIN_PROTECT.actions.2:
    source: Move harvested produce and seed to a dry, high place.
    text: పండించిన ఉత్పత్తులు మరియు విత్తనాలను పొడి, ఎత్తైన ప్రదేశానికి తరలించండి.
    status: machine
  templates.DRY_SPELL_CONSERVE_MOISTURE.verdict:
    source: Save soil moisture
    text: నేల తేమను కాపాడండి
    status: machine
  templates.DRY_SPELL_CONSERVE_MOISTURE.verdict_sub:
    source: '{crop}'
    text: '{crop}'
    status: machine
  templates.DRY_SPELL_CONSERVE_MOISTURE.headline:
    source: A dry period is expected. Save the moisture in your {crop} field.
    text: పొడిగా ఉండే కాలం ఉంటుందని అంచనా. మీ {crop} పొలంలో తేమను ఆదా చేయండి.
    status: machine
  templates.DRY_SPELL_CONSERVE_MOISTURE.actions.0:
    source: Remove weeds, because they take water from the crop.
    text: కలుపు మొక్కలను తొలగించండి, ఎందుకంటే అవి పంట నుండి నీటిని తీసుకుంటాయి.
    status: machine
  templates.DRY_SPELL_CONSERVE_MOISTURE.actions.1:
    source: Loosen the top soil lightly between the rows, or cover the soil with crop residue.
    text: వరుసల మధ్య ఎగువ మట్టిని తేలికగా వదులుకోండి లేదా మట్టిని పంట అవశేషాలతో కప్పండి.
    status: machine
  templates.DRY_SPELL_CONSERVE_MOISTURE.actions.2:
    source: Wait for rain before you apply top-dressing fertiliser.
    text: మీరు టాప్-డ్రెస్సింగ్ ఎరువులను అప్లై చేసే ముందు వర్షం కోసం వేచి ఉండండి.
    status: machine
  templates.ALL_CLEAR.verdict:
    source: No action needed
    text: చర్య అవసరం లేదు
    status: machine
  templates.ALL_CLEAR.verdict_sub:
    source: '{crop}: conditions normal'
    text: '{crop}: పరిస్థితులు సాధారణం'
    status: machine
  templates.ALL_CLEAR.headline:
    source: No weather risk is expected for {crop} in the coming weeks.
    text: రాబోయే వారాల్లో {crop} కు ఎటువంటి వాతావరణ ప్రమాదం ఉండదని అంచనా.
    status: machine
  templates.ALL_CLEAR.actions.0:
    source: Continue your normal farm work.
    text: మీ సాధారణ వ్యవసాయ పనిని కొనసాగించండి.
    status: machine
  templates.ALL_CLEAR.actions.1:
    source: We will message you if the forecast changes.
    text: సూచన మారితే మేము మీకు సందేశం పంపుతాము.
    status: machine
