entries:
  strings.service:
    source: Mungaru monsoon advisories
    text: मुंगारूचा सल्ला
    status: machine
  strings.welcome_word:
    source: Welcome
    text: स्वागत आहे
    status: machine
  strings.tagline:
    source: Monsoon advice for your farm
    text: तुमच्या शेतासाठी पावसाळी सल्ला
    status: machine
  strings.your_block:
    source: Your block
    text: तुमचा ब्लॉक
    status: machine
  strings.subscribed_title:
    source: You are subscribed
    text: तुम्ही सदस्य आहात
    status: machine
  strings.outlook_usual:
    source: usually {usual}
    text: सहसा {usual}
    status: machine
  strings.lang_word:
    source: Language
    text: भाषा
    status: machine
  strings.lang_list_button:
    source: Languages
    text: भाषा
    status: machine
  strings.welcome:
    source: Welcome to Mungaru. We send free weather advice for your crops, approved by your agriculture officer.
    text: मुंगारूमध्ये आपले स्वागत आहे. तुमच्या कृषी अधिकाऱ्याने मान्यता दिलेल्या तुमच्या पिकांसाठी आम्ही विनामूल्य हवामानाचा सल्ला पाठवतो.
    status: machine
  strings.location_prompt:
    source: Share your farm location so we can find your block. Tap the button below, or type your 6-digit PIN code.
    text: तुमचे शेत ठिकाण सामायिक करा जेणेकरून आम्हाला तुमचा ब्लॉक सापडेल. खालील बटणावर टिचकी मारा किंवा तुमचा 6 अंकी पिन कोड टाइप करा.
    status: machine
  strings.block_found:
    source: Your block is {block}, {district} district. Is this correct?
    text: तुमचा गट {block}, {district} जिल्हा आहे. हे बरोबर आहे का?
    status: machine
  strings.btn_yes:
    source: Yes, correct
    text: होय, बरोबर आहे
    status: machine
  strings.btn_no:
    source: No, change it
    text: नाही, ते बदला
    status: machine
  strings.block_not_found:
    source: We could not find a block for this location. Please share your location again, or type your 6-digit PIN code.
    text: आम्हाला या ठिकाणासाठी ब्लॉक सापडत नाही. कृपया तुमचे स्थान पुन्हा सामायिक करा किंवा तुमचा 6 अंकी पिन कोड टाइप करा.
    status: machine
  strings.pin_not_found:
    source: We could not find the PIN code {pin}. Please check it, or share your location.
    text: आम्हाला पिन कोड {pin} सापडला नाही. कृपया तो तपासा किंवा तुमचे स्थान सामायिक करा.
    status: machine
  strings.pick_block:
    source: Choose your block from the list.
    text: यादीमधून तुमचा ब्लॉक निवडा.
    status: machine
  strings.pick_block_button:
    source: Blocks
    text: गट
    status: machine
  strings.share_again:
    source: Share location again
    text: ठिकाण पाठवा
    status: machine
  strings.crop_prompt:
    source: Which crop do you grow? Choose one. You can add more after this.
    text: तुम्ही कोणते पीक घेता? एक निवडा. त्यानंतर तुम्ही आणखी पिक जोडू शकता.
    status: machine
  strings.crop_list_button:
    source: Crops
    text: पिके
    status: machine
  strings.crop_added:
    source: 'Selected: {crops}. Add another crop, or tap Done.'
    text: निवडलेलेः {crops}. दुसरे पीक जोडा, किंवा पूर्ण झाले दाबा.
    status: machine
  strings.btn_add_crop:
    source: Add another crop
    text: आणखी एक पीक घाला
    status: machine
  strings.other_crop:
    source: Other crop
    text: इतर पीक
    status: machine
  strings.crop_type_prompt:
    source: Type the name of your crop.
    text: तुमच्या पिकाचे नाव टाइप करा.
    status: machine
  strings.crop_done:
    source: Done
    text: पूर्ण झाले
    status: machine
  strings.crop_need_one:
    source: Please choose at least one crop.
    text: कृपया किमान एक पीक निवडा.
    status: machine
  strings.subscribed:
    source: You are subscribed. We will send advice for {crops} in {block} when there is something you need to know. Send STOP at any time to stop.
    text: तुम्ही सदस्यत्व घेतले आहे. तुम्हाला काही माहिती असणे आवश्यक असेल तेव्हा आम्ही {crops} साठी {block} मध्ये सल्ला पाठवू. थांबण्यासाठी कोणत्याही वेळी STOP पाठवा.
    status: machine
  strings.crops_updated:
    source: 'Your crops are now: {crops}.'
    text: तुमची पिके आताः {crops} आहेत.
    status: machine
  strings.menu_prompt:
    source: What would you like to do?
    text: तुम्हाला काय करायला आवडेल?
    status: machine
  strings.menu_footer:
    source: Send STOP to unsubscribe
    text: सदस्यता रद्द करण्यासाठी STOP पाठवा
    status: machine
  strings.btn_outlook:
    source: 4-week outlook
    text: पुढील 4 आठवडे
    status: machine
  strings.btn_change_crop:
    source: Change crop
    text: पीक बदला
    status: machine
  strings.btn_officer:
    source: Talk to officer
    text: कॉल अधिकारी
    status: machine
  strings.btn_menu:
    source: Main menu
    text: मुख्य मेनू
    status: machine
  strings.officer_intro:
    source: Here is your agriculture officer. Tap the contact to call.
    text: हा तुमचा कृषी अधिकारी आहे. संपर्क साधण्यासाठी संपर्कावर टिचकी मारा.
    status: machine
  strings.officer_kcc:
    source: 'Kisan Call Centre, free call: {kcc}'
    text: किसान कॉल सेंटर, मोफत कॉलः {kcc}
    status: machine
  strings.officer_notified:
    source: We have also asked the officer to call you.
    text: आम्ही अधिकाऱ्याला तुम्हाला फोन करण्यासही सांगितले आहे.
    status: machine
  strings.officer_alert:
    source: 'A farmer in {block} asked to talk. Phone: {phone}. Crops: {crops}.'
    text: '{block} मधील एका शेतकऱ्याला बोलण्यास सांगितले. दूरध्वनीः {phone}. पिकेः {crops}.'
    status: machine
  strings.no_officer:
    source: No officer is listed for your block yet. Please call the Kisan Call Centre.
    text: तुमच्या गटासाठी अद्याप कोणत्याही अधिकाऱ्याची यादी झालेली नाही. कृपया किसान कॉल सेंटरला फोन करा.
    status: machine
  strings.stop_confirm:
    source: You are unsubscribed. You will not get any more messages. Send START to subscribe again.
    text: तुम्ही सदस्यता रद्द केली आहे. तुम्हाला आणखी संदेश मिळणार नाहीत. पुन्हा सदस्यता घेण्यासाठी START पाठवा.
    status: machine
  strings.start_confirm:
    source: Welcome back. You are subscribed again.
    text: तुमचे पुन्हा स्वागत आहे. तुम्ही पुन्हा सदस्यता घेतली आहे.
    status: machine
  strings.opted_out_hint:
    source: You are unsubscribed. Send START to subscribe again.
    text: तुम्ही सदस्यता रद्द केली आहे. पुन्हा सदस्यता घेण्यासाठी START पाठवा.
    status: machine
  strings.tap_hint:
    source: Please tap one of the buttons below.
    text: कृपया खालील बटणांपैकी एक दाबा.
    status: machine
  strings.language_changed:
    source: Language changed.
    text: भाषा बदलली.
    status: machine
  strings.outlook_title:
    source: Weather forecast for {block}, next 4 weeks
    text: '{block} साठी, पुढील 4 आठवड्यांसाठी हवामानाचा अंदाज'
    status: machine
  strings.outlook_unavailable:
    source: The forecast for {block} is not available right now. Please try again later.
    text: '{block} चा अंदाज सध्या उपलब्ध नाही. कृपया नंतर पुन्हा प्रयत्न करा.'
    status: machine
  strings.outlook_line:
    source: '{event}: {chance} (usually {usual})'
    text: '{event}: {chance} (सहसा {usual})'
    status: machine
  strings.outlook_footer:
    source: The forecast for week 4 is less certain than for week 1.
    text: चौथ्या आठवड्याचा अंदाज पहिल्या आठवड्यापेक्षा कमी निश्चित आहे.
    status: machine
  strings.outlook_normal:
    source: Close to normal
    text: सामान्यच्या जवळ
    status: machine
  strings.week_label:
    source: Week {n}
    text: आठवडा {n}
    status: machine
  strings.chance:
    source: '{n} in 10'
    text: 10 पैकी {n}
    status: machine
  strings.chance_lt1:
    source: less than 1 in 10
    text: 10 पैकी 1 पेक्षा कमी
    status: machine
  strings.reason:
    source: Between {start} and {end}, the chance of {event} is {chance}. The usual chance is {usual}.
    text: '{start} आणि {end} दरम्यान, {event} ची शक्यता {chance} आहे. नेहमीची शक्यता {usual} आहे.'
    status: machine
  strings.valid:
    source: Valid {valid_from} to {valid_to}
    text: वैध {valid_from} ते {valid_to}
    status: machine
  strings.source:
    source: Based on IMD data · {product}
    text: IMD माहितीवर आधारित · {product}
    status: machine
  strings.next_weeks:
    source: Next 4 weeks
    text: पुढील 4 आठवडे
    status: machine
  strings.what_to_do:
    source: What to do
    text: काय करावे?
    status: machine
  strings.confidence_high:
    source: High certainty
    text: उच्च खात्री
    status: machine
  strings.confidence_medium:
    source: Medium certainty
    text: मध्यम निश्चितता
    status: machine
  strings.confidence_low:
    source: Low certainty
    text: कमी खात्री
    status: machine
  strings.cmri_normal:
    source: Normal
    text: ग्रीन अलर्ट
    status: machine
  strings.cmri_watch:
    source: Watch
    text: पिवळा इशारा
    status: machine
  strings.cmri_warning:
    source: Warning
    text: ऑरेंज अलर्ट
    status: machine
  strings.cmri_alert:
    source: Alert
    text: रेड अलर्ट
    status: machine
  strings.imd_normal:
    source: No action needed
    text: कारवाईची गरज नाही
    status: machine
  strings.imd_watch:
    source: Be aware
    text: जागरूक राहा
    status: machine
  strings.imd_warning:
    source: Be prepared
    text: तयारी ठेवा
    status: machine
  strings.imd_alert:
    source: Take action
    text: कारवाई करा
    status: machine
  strings.ev_onset:
    source: Rain starts
    text: पावसाळ्याची सुरुवात
    status: machine
  strings.ev_dry_spell:
    source: Dry period
    text: कोरडा कालावधी
    status: machine
  strings.ev_heavy_rain:
    source: Heavy rain
    text: मुसळधार पाऊस
    status: machine
  strings.event_onset:
    source: the start of steady monsoon rain
    text: मान्सूनच्या स्थिर पावसाची सुरुवात
    status: machine
  strings.event_false_onset:
    source: early rain followed by a long dry period
    text: लवकर पाऊस पडल्यानंतर दीर्घ कोरडे कालावधी
    status: machine
  strings.event_dry_spell_7d:
    source: a dry period of 7 days or more without rain
    text: पावसाशिवाय 7 दिवस किंवा त्याहून अधिक काळ कोरडा कालावधी
    status: machine
  strings.event_dry_spell_10d:
    source: a dry period of 10 days or more without rain
    text: 10 दिवस किंवा त्याहून अधिक काळ पाऊस न पडल्यास कोरडा कालावधी
    status: machine
  strings.event_heavy_rain:
    source: heavy rain of more than 6 cm in a day
    text: एका दिवसात 6 सेंटीमीटरपेक्षा जास्त पाऊस
    status: machine
  templates.DELAY_SOWING.verdict:
    source: Wait to sow
    text: पेरणीची प्रतीक्षा करा
    status: machine
  templates.DELAY_SOWING.verdict_sub:
    source: '{crop}: sow after {wait_until}'
    text: '{crop}: {wait_until} नंतर पेरणी करा'
    status: machine
  templates.DELAY_SOWING.headline:
    source: Do not sow {crop} before {wait_until}.
    text: '{wait_until} आधी {crop} पेरू नका.'
    status: machine
  templates.DELAY_SOWING.actions.0:
    source: Do not sow now, even if it rains this week. The seed may dry out and die.
    text: या आठवड्यात पाऊस पडला तरी आता पेरणी करू नका. बियाणे कोरडे होऊन मरू शकते.
    status: machine
  templates.DELAY_SOWING.actions.1:
    source: Keep your seed and fertiliser ready.
    text: तुमचे बियाणे आणि खत तयार ठेवा.
    status: machine
  templates.DELAY_SOWING.actions.2:
    source: When the soil is moist 15 cm deep, sow after {wait_until}.
    text: जेव्हा माती 15 सेंटीमीटर खोल ओलसर असेल, तेव्हा {wait_until} नंतर पेरणी करा.
    status: machine
  templates.SOW_NOW.verdict:
    source: Sow now
    text: आता पेरणी करा
    status: machine
  templates.SOW_NOW.verdict_sub:
    source: '{crop}: sow before {sow_by}'
    text: '{crop}: {sow_by} च्या आधी पेरणी करा'
    status: machine
  templates.SOW_NOW.headline:
    source: This is a good time to sow {crop}. Sow before {sow_by}.
    text: '{crop} पेरणीसाठी ही चांगली वेळ आहे. {sow_by} आधी पेरणी करा.'
    status: machine
  templates.SOW_NOW.actions.0:
    source: The soil has enough moisture and steady rain is expected.
    text: मातीमध्ये पुरेसा ओलावा आहे आणि स्थिर पाऊस अपेक्षित आहे.
    status: machine
  templates.SOW_NOW.actions.1:
    source: Use treated seed of a recommended variety.
    text: शिफारस केलेल्या जातीचे उपचारित बियाणे वापरा.
    status: machine
  templates.SOW_NOW.actions.2:
    source: Apply basal fertiliser at sowing.
    text: पेरणीवेळी मूळ खत लावा.
    status: machine
  templates.PREPARE_IRRIGATION.verdict:
    source: Get irrigation ready
    text: सिंचनाची तयारी करा
    status: machine
  templates.PREPARE_IRRIGATION.verdict_sub:
    source: '{crop}'
    text: '{crop}'
    status: machine
  templates.PREPARE_IRRIGATION.headline:
    source: A dry period may affect your {crop}. Get ready to irrigate.
    text: कोरड्या कालावधीचा तुमच्या {crop} वर परिणाम होऊ शकतो. सिंचनासाठी तयार राहा.
    status: machine
  templates.PREPARE_IRRIGATION.actions.0:
    source: Check your pump, pipes and water source now.
    text: तुमचा पंप, पाईप आणि पाण्याचा स्रोत आता तपासा.
    status: machine
  templates.PREPARE_IRRIGATION.actions.1:
    source: If there is no rain for a week, irrigate the crop once.
    text: आठवडाभर पाऊस नसेल तर एकदा पिकाला सिंचन करा.
    status: machine
  templates.PREPARE_IRRIGATION.actions.2:
    source: Irrigate in the evening or early morning to save water.
    text: पाणी वाचवण्यासाठी संध्याकाळी किंवा पहाटे लवकर सिंचन करा.
    status: machine
  templates.SWITCH_CROP.verdict:
    source: Switch to {alternative}
    text: '{alternative} वर जा'
    status: machine
  templates.SWITCH_CROP.verdict_sub:
    source: instead of {crop}
    text: '{crop} ऐवजी'
    status: machine
  templates.SWITCH_CROP.headline:
    source: It is too risky to sow {crop} now. Sow {alternative} instead, before {sow_by}.
    text: आता {crop} पेरणी करणे खूप धोकादायक आहे. त्याऐवजी {sow_by} आधी {alternative} पेरणी करा.
    status: machine
  templates.SWITCH_CROP.actions.0:
    source: Do not sow {crop} this season on land without irrigation.
    text: या हंगामात सिंचनाशिवाय जमिनीवर {crop} पेरणी करू नका.
    status: machine
  templates.SWITCH_CROP.actions.1:
    source: Sow {alternative} before {sow_by}. It needs less water and less time.
    text: '{sow_by} आधी {alternative} पेरणी करा. त्यासाठी कमी पाणी आणि कमी वेळ लागतो.'
    status: machine
  templates.SWITCH_CROP.actions.2:
    source: Ask your agriculture office or KVK for {alternative} seed.
    text: तुमच्या कृषी कार्यालयाला किंवा KVK ला {alternative} बियाणे विचारा.
    status: machine
  templates.HEAVY_RAIN_PROTECT.verdict:
    source: Heavy rain coming
    text: मुसळधार पाऊस येणार
    status: machine
  templates.HEAVY_RAIN_PROTECT.verdict_sub:
    source: Protect {crop}
    text: '{crop} संरक्षित करा'
    status: machine
  templates.HEAVY_RAIN_PROTECT.headline:
    source: Heavy rain is expected. Protect your {crop} and stored produce.
    text: मुसळधार पाऊस अपेक्षित आहे. तुमचे {crop} आणि साठवलेल्या उत्पादनांचे संरक्षण करा.
    status: machine
  templates.HEAVY_RAIN_PROTECT.actions.0:
    source: Clear the field drains so that water does not stand in the field.
    text: शेतात पाणी साठणार नाही म्हणून शेतातील नाले साफ करा.
    status: machine
  templates.HEAVY_RAIN_PROTECT.actions.1:
    source: Do not spray pesticide or apply fertiliser before the rain.
    text: पावसाच्या आधी कीटकनाशक फवारणी करू नका किंवा खत लावू नका.
    status: machine
  templates.HEAVY_RAIN_PROTECT.actions.2:
    source: Move harvested produce and seed to a dry, high place.
    text: कापणी केलेली उत्पादने आणि बियाणे कोरड्या, उंच ठिकाणी हलवा.
    status: machine
  templates.DRY_SPELL_CONSERVE_MOISTURE.verdict:
    source: Save soil moisture
    text: मातीतील आर्द्रता वाचवा
    status: machine
  templates.DRY_SPELL_CONSERVE_MOISTURE.verdict_sub:
    source: '{crop}'
    text: '{crop}'
    status: machine
  templates.DRY_SPELL_CONSERVE_MOISTURE.headline:
    source: A dry period is expected. Save the moisture in your {crop} field.
    text: कोरडा कालावधी अपेक्षित आहे. तुमच्या {crop} शेतातील आर्द्रता वाचवा.
    status: machine
  templates.DRY_SPELL_CONSERVE_MOISTURE.actions.0:
    source: Remove weeds, because they take water from the crop.
    text: तण काढून टाका, कारण ते पिकातून पाणी घेतात.
    status: machine
  templates.DRY_SPELL_CONSERVE_MOISTURE.actions.1:
    source: Loosen the top soil lightly between the rows, or cover the soil with crop residue.
    text: वरच्या मातीला रांगांच्या दरम्यान हलक्याशा सैल करा किंवा मातीला पिकांच्या अवशेषांनी झाकून ठेवा.
    status: machine
  templates.DRY_SPELL_CONSERVE_MOISTURE.actions.2:
    source: Wait for rain before you apply top-dressing fertiliser.
    text: टॉप ड्रेसिंग खत लावण्यापूर्वी पावसाची प्रतीक्षा करा.
    status: machine
  templates.ALL_CLEAR.verdict:
    source: No action needed
    text: कारवाईची गरज नाही
    status: machine
  templates.ALL_CLEAR.verdict_sub:
    source: '{crop}: conditions normal'
    text: '{crop}: परिस्थिती सामान्य'
    status: machine
  templates.ALL_CLEAR.headline:
    source: No weather risk is expected for {crop} in the coming weeks.
    text: आगामी आठवड्यांमध्ये {crop} साठी हवामानाचा कोणताही धोका अपेक्षित नाही.
    status: machine
  templates.ALL_CLEAR.actions.0:
    source: Continue your normal farm work.
    text: तुमची सामान्य शेतीची कामे सुरू ठेवा.
    status: machine
  templates.ALL_CLEAR.actions.1:
    source: We will message you if the forecast changes.
    text: अंदाज बदलल्यास आम्ही तुम्हाला संदेश पाठवू.
    status: machine
